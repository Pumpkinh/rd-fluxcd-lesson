apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-app
  labels:
    app.kubernetes.io/name: course-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: course-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: course-app
    spec:
      containers:
        - name: course-app
          image: pimenov2unit/course-app:lesson-12
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: POSTGRES_DB
              value: guessdb
            - name: POSTGRES_USER
              value: guessuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: course-app-db-credentials
                  key: password
            - name: POSTGRES_HOST
              value: course-app-db-rw
            - name: POSTGRES_PORT
              value: "5432"
            - name: FLASK_SECRET_KEY
              value: super-secret-key
            - name: APP_BANNER
              value: "Lesson 13: GitOps with Flux CD"
            - name: APP_VERSION
              value: "lesson-13"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
